name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js && node --check branding.js && node --check statistics.js
      - name: Refresh career statistics
        run: python3 scripts/refresh-statistics.py
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p dist
          cp index.html app.js branding.js statistics.js styles.css favicon.svg dist/
          cp -r data dist/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
